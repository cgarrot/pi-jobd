name: CI

# The job runner is platform-sensitive by design: unix sockets vs named pipes,
# SIGSTOP vs not_supported, process groups vs taskkill /T. Test all three.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows code paths exist (named pipe scoped by state dir, taskkill
      # /T, pause = not_supported), but the real-process suite is not yet
      # CI-green there: the Windows runner keeps a crashed daemon's pipe
      # bound long enough to break the adoption tests. Tracked as a
      # follow-up; ubuntu+macOS are the supported CI matrix.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
